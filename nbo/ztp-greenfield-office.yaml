name: ztp-greenfield-office
description: >-
  Turn up a greenfield office with zero touch, from an empty location to a commissioned site: plan and allocate in
  Nautobot, install on site, bootstrap the Palo first and everything else from its DHCP, onboard the platforms,
  upgrade and configure every device, validate, retire the bootstrap and hand the site over. Each phase ends at a
  gate that records its evidence, and the open design decisions are choices on the start form.
for: location
lifecycle:
  - Planned
  - Ready for install
  - Installed
  - Bootstrapped
  - Platform connected
  - Fully configured
  - Validated
  - Commissioned
inputs:
  ticket: {type: string, pattern: "^(RITM|CHG)[0-9]{7}$", help: "The site-build request, such as RITM0099001"}
  airport_code:
    type: string
    label: "Airport code"
    pattern: "^[A-Z]{3}$"
    help: "The IATA code the site is named after, such as SJC"
  office_type:
    type: choice
    label: "Office type"
    choices: [normal, ebc]
    default: normal
    help: "The profile, not the workflow, changes: EBC adds the AV VLAN, multicast and QoS"
  ap_count: {type: integer, label: "Access points", default: 6, min: 1, max: 40}
  palo_bootstrap:
    type: choice
    label: "Z1: Palo bootstrap"
    choices: [usb, panorama-ztp]
    default: usb
    help: "USB: an operator burns the file Nautobot renders. Palo ZTP service: needs a Security sign-off"
  switch_management:
    type: choice
    label: "Z2: Cisco 9300 managed by"
    choices: [meraki, cli]
    default: meraki
    help: "Meraki mode is pending the lab test; CLI has Nautobot upgrade and configure the stack"
  file_server:
    type: choice
    label: "Z3: ZTP file server"
    choices: [central, nautobot, opengear, aws]
    default: central
    help: "Where the Option 67 URL points"
  pam: {type: choice, label: "Z8: PAM", choices: [delinea, beyondtrust], default: delinea}
  ap_walkthrough:
    type: boolean
    label: "AP walkthrough"
    default: false
    help: "A field walk of the APs against the floor plan: probably out of scope (10-21 00:48)"
  demo_failure:
    type: choice
    label: "Demo: make a step fail"
    help: "Fails once for this ticket, so you can show the recovery"
    choices:
      - none
      - usb-not-read
      - identity-mismatch
      - iosxe-too-old
      - ha-join-fails
      - apc-upgrade-flaky
      - pam-timeout
      - tunnel-down
      - deviation
    default: none
steps:
  - phase: Plan
  - Validate intake: ztp.ValidateIntake
  - Allocate office addressing:
      job: ztp.AllocateOfficeAddressing
      rollback: ztp.ReleaseOfficeAddressing
  - Create office records:
      job: ztp.CreateOfficeRecords
      with: {addresses: allocate_office_addressing.addresses}
  - Select profile and firmware: ztp.SelectTargets
  - Generate bootstrap artifacts:
      job: ztp.GenerateBootstrapArtifacts
      with: {addresses: allocate_office_addressing.addresses}
  - Publish bootstrap files:
      job: ztp.PublishBootstrapFiles
      with:
        artifact_version: generate_bootstrap_artifacts.artifact_version
        addresses: allocate_office_addressing.addresses
  - Request DNS records:
      job: itsm.RequestDnsRecords
      after: [Create office records]
  - Request cloud onboarding:
      job: itsm.RequestCloudOnboarding
      after: [Create office records]
  - Prepare Panorama:
      job: panorama.PrepareOffice
      after: [Create office records]
  - Prepare Meraki network:
      job: meraki.PrepareNetwork
      after: [Create office records]
  - Security sign-off for cloud bootstrap:
      approve: security-architects
      description: >-
        The Palo ZTP service needs the Panorama ZTP plugin and Panorama reachable from the internet while the
        firewalls bootstrap. Approve the temporary exposure, or reject to bootstrap from USB instead.
      when: {palo_bootstrap: panorama-ztp}
      after: [Create office records]
      timeout: 5d
  - Register firewalls for cloud ZTP:
      job: panorama.RegisterZtpSerials
      when: {palo_bootstrap: panorama-ztp}
  - Pre-site tickets resolved:
      wait: itsm.TicketsResolved
      with: {dns_ticket: request_dns_records.dns_ticket, jira_key: request_cloud_onboarding.jira_key}
      after: [Request DNS records, Request cloud onboarding]
      timeout: 10d
  - Confirm site readiness:
      job: ztp.ConfirmSiteReadiness
      manual: network-engineering
      description: >-
        MDF and patching are a hard prerequisite before any device work. Tick what you have confirmed with the site;
        anything unticked fails the step, and Retry with changes records it once it's done.
      after: [Create office records]
  - Ready-for-install gate:
      wait: ztp.ReadinessGate
      after:
        - Publish bootstrap files
        - Pre-site tickets resolved
        - Confirm site readiness
        - Prepare Panorama
        - Prepare Meraki network
        - Register firewalls for cloud ZTP
      timeout: 1h
  - Mark ready for install:
      job: ztp.SetSiteLifecycle
      with: {stage: 1}

  - phase: Install
  - Circuit delivered:
      description: >-
        The carrier calls back when the DIA circuit is extended to the MDF and tested, with the circuit ID.
      wait: callback
      with: {circuit: create_office_records.circuit_id}
      after: [Mark ready for install]
      timeout: 30d
  - Rack, power and cable:
      manual: field-ops
      description: >-
        Rack and stack per the layout, cable to the temporary bootstrap port map below, and power on in order: the
        9300 first, then the Palo pair, then the OpenGear. Don't configure anything: the devices bootstrap themselves.
      with:
        rack_layout: create_office_records.rack_layout
        port_map: create_office_records.port_map
        power_on_order: create_office_records.power_on_order
      after: [Mark ready for install]
  - Record field tests:
      job: ztp.RecordFieldTests
      manual: field-ops
      description: Record the circuit turn-up test and the link state of switch ports 1 to 4, with the rack photos.
      after: ["Rack, power and cable", Circuit delivered]
  - Installed gate:
      wait: ztp.PhysicalGate
      timeout: 2h
  - Mark installed:
      job: ztp.SetSiteLifecycle
      with: {stage: 2}

  - phase: Bootstrap
  - Bootstrap firewalls:
      description: >-
        The Palo comes up first: every other device depends on its DHCP. The 9300's factory VLAN 1 bridges the ISP
        to the Palo's WAN. The active firewall bootstraps, then the passive one.
      for_each: create_office_records.firewalls
      workflow: ztp-firewall-bootstrap
      with: {artifact_version: generate_bootstrap_artifacts.artifact_version}
      waves: 1
  - Serve DHCP option 67:
      job: panorama.ServeOption67
      with:
        option67_url: publish_bootstrap_files.option67_url
        template_stack: prepare_panorama.template_stack
  - Bootstrap from option 67:
      description: >-
        The switch, the OpenGear and the APC cards each take DHCP from the Palo, fetch their file from the Option 67
        URL by serial, and the file server calls back. Nautobot checks each one is the box it planned.
      for_each: create_office_records.infrastructure
      workflow: ztp-call-home
      with: {artifact_version: generate_bootstrap_artifacts.artifact_version}
  - Bootstrapped gate:
      wait: ztp.BootstrapGate
      timeout: 1h
  - Mark bootstrapped:
      job: ztp.SetSiteLifecycle
      with: {stage: 3}

  - phase: Platform onboarding
  - Activate firewall licences: panorama.ActivateLicences
  - Form HA pair:
      job: panorama.FormHaPair
      rollback: panorama.BreakHaPair
      timeout: 30m
  - Claim Meraki devices:
      job: meraki.ClaimDevices
      with: {network_id: prepare_meraki_network.network_id}
      after: [Mark bootstrapped]
  - Meraki devices online:
      wait: meraki.DevicesOnline
      with: {network_id: prepare_meraki_network.network_id}
      timeout: 2h
  - Platform-connected gate:
      wait: ztp.PlatformGate
      after: [Form HA pair, Meraki devices online]
      timeout: 1h
  - Mark platform connected:
      job: ztp.SetSiteLifecycle
      with: {stage: 4}

  - phase: Configure
  - Configure firewalls:
      description: Upgrade PAN-OS and push the Panorama templates, one firewall at a time so the pair keeps a peer.
      for_each: create_office_records.firewalls
      workflow: ztp-device-build
      waves: 1
  - Configure infrastructure:
      description: Upgrade and configure the switch, the OpenGear and the APC cards, all at once.
      for_each: create_office_records.infrastructure
      workflow: ztp-device-build
      after: [Mark platform connected]
  - Upgrade AP firmware:
      job: meraki.UpgradeFirmware
      with: {network_id: prepare_meraki_network.network_id}
      after: [Mark platform connected]
  - Raise corporate connection change:
      job: itsm.RaiseChange
      after: [Mark platform connected]
  - Fully-configured gate:
      wait: ztp.ConfigurationGate
      after: [Configure firewalls, Configure infrastructure, Upgrade AP firmware]
      timeout: 1h
  - Mark fully configured:
      job: ztp.SetSiteLifecycle
      with: {stage: 5}

  - phase: Validate
  - CAB approved:
      description: >-
        Connecting the office to the corporate network needs its own change. ServiceNow calls back when the CAB
        decides; a rejection fails the step and nothing is connected.
      wait: callback
      with: {change: raise_corporate_connection_change.change_number}
      after: [Raise corporate connection change]
      timeout: 5d
  - Connect to corporate network:
      job: panorama.EnableCorporateTunnels
      rollback: panorama.DisableCorporateTunnels
      with: {change_number: raise_corporate_connection_change.change_number}
      after: [CAB approved, Mark fully configured]
  - Validate firewalls:
      wait: panorama.ValidateFirewalls
      timeout: 1h
  - Validate wireless:
      job: meraki.ValidateWireless
      with: {network_id: prepare_meraki_network.network_id}
      after: [Mark fully configured]
  - Sync Meraki to Nautobot:
      job: meraki.SyncToNautobot
      with: {network_id: prepare_meraki_network.network_id}
  - Add to Datadog:
      job: datadog.AddSnmpDevices
      after: [Mark fully configured]
  - Datadog polling:
      wait: datadog.DevicesPolled
      timeout: 1h
  - Enroll in config backup:
      job: backup.EnrollDevices
      after: [Mark fully configured]
  - Update DNS and IPAM:
      job: ztp.UpdateDnsAndIpam
      after: [Mark fully configured]
  - Reconcile with the model:
      job: ztp.ReconcileSite
      after: [Validate firewalls, Sync Meraki to Nautobot, Datadog polling, Enroll in config backup, Update DNS and IPAM]
  - Retire bootstrap:
      job: ztp.RetireBootstrap
      with: {artifact_version: generate_bootstrap_artifacts.artifact_version}
  - Validated gate:
      wait: ztp.ValidationGate
      timeout: 1h
  - Mark validated:
      job: ztp.SetSiteLifecycle
      with: {stage: 6}

  - phase: Commission
  - Accept deviations:
      approve: network-engineering
      description: >-
        Reconciliation found the office differs from its model. Read the deviations, and approve only if the site
        can be accepted as it is, with the record corrected after.
      when: {reconcile_with_the_model.deviations: true}
      timeout: 7d
  - Walk the APs:
      manual: field-ops
      description: Walk the floor plan and check each AP is mounted where the plan says.
      when: {ap_walkthrough: true}
      with: {access_points: create_office_records.access_points}
      after: [Mark validated]
  - Site acceptance:
      approve: network-engineering
      description: >-
        Accept the site: no critical exceptions, records complete, every gate's evidence recorded, ownership handed
        to operations.
      after: [Accept deviations, Walk the APs]
      timeout: 14d
  - Commission site: ztp.CommissionSite
  - Close change:
      job: itsm.CloseChange
      with: {change_number: raise_corporate_connection_change.change_number, details: validated_gate.evidence}
  - Notify:
      job: demo.Notify
      with: {run_id: run.id, requested_by: run.requested_by, details: create_office_records.inventory}
