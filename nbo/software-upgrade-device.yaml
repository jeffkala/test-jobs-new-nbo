name: software-upgrade-device
description: >-
  Upgrade one switch: snapshot it and check its flash side by side, copy and verify the image, install and reload
  when an engineer with console access starts it, wait for it to come back, and prove nothing was lost.
for: device
inputs:
  ticket: {type: string, default: CHG0000000}
  target_version: {type: string, default: "17.12.4"}
  change_number: {type: string, optional: true}
  image_md5: {type: string, optional: true}
  demo_failure: {type: string, default: none}
steps:
  - phase: Prepare
  - Inside change window:
      wait: itsm.InsideWindow
      timeout: 7d
  - Snapshot before: software.Snapshot
  - Check flash:
      job: software.CheckFlash
      after: [Inside change window]
  - Copy image:
      job: software.CopyImage
      timeout: 30m
  - Verify image: software.VerifyImage

  - phase: Upgrade
  - Install and reload:
      job: software.InstallImage
      manual: network-ops
      rollback: software.RollbackImage
      description: >-
        Confirm you have console access, choose when to reload, and start. If the install fails the device is
        rolled back to the version it ran.
      after: [Snapshot before, Verify image]
      timeout: 30m
  - Device back:
      wait: software.DeviceBack
      timeout: 1h

  - phase: Verify
  - Snapshot after: software.Snapshot
  - Compare before and after:
      job: software.ComparePrePost
      with: {pre: snapshot_before.snapshot, post: snapshot_after.snapshot}
  - Record version in Nautobot: software.RecordVersion
