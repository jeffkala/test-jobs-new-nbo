# The mock jobs' catalogue entries: what a rerun does (effect) and what each returns (gives).
# Variables are listed too, so `nbo validate` checks the workflows offline, before Nautobot has the jobs.
# Every mock job also takes fail_percent, min_seconds and max_seconds.

mock.AllocateAddressing:
  vars: [location, site_code, fail_percent, min_seconds, max_seconds]
  effect: idempotent
  gives: {mgmt_prefix: string}
mock.ReleaseAddressing:
  vars: [location, site_code, fail_percent, min_seconds, max_seconds]
  effect: idempotent
mock.DiscoverDevices:
  vars: [location, fail_percent, min_seconds, max_seconds]
  effect: read
  gives: {devices: list, count: integer}
mock.GeneratePortMap:
  vars: [location, fail_percent, min_seconds, max_seconds]
  effect: read
  gives: {port_map: list}
mock.OrderCircuit:
  vars: [location, site_code, fail_percent, min_seconds, max_seconds]
  effect: opens_external
  gives: {order_id: string}
mock.SetLifecycle:
  vars: [location, stage, fail_percent, min_seconds, max_seconds]
  effect: idempotent
  gives: {stage: string}
mock.Notify:
  vars: [message, run_id, fail_percent, min_seconds, max_seconds]
  effect: idempotent
  gives: {sent: boolean}
mock.PreCheck:
  vars: [device, fail_percent, min_seconds, max_seconds]
  effect: read
  gives: {snapshot: json, fits: boolean, risk: string}
mock.Reachable:
  vars: [device, ready_percent, fail_percent, min_seconds, max_seconds]
  effect: read
  gives: {latency_ms: integer}
mock.RecordWindow:
  vars: [window, notes, confirmed, fail_percent, min_seconds, max_seconds]
  effect: idempotent
  gives: {window: string, notes: string, confirmed: boolean}
mock.ApplyChange:
  vars: [device, vlan, change_ticket, fail_percent, min_seconds, max_seconds]
  effect: changes_network
  gives: {applied_vlan: integer, config_lines: integer}
mock.RevertChange:
  vars: [device, vlan, fail_percent, min_seconds, max_seconds]
  effect: idempotent
mock.PostCheck:
  vars: [device, fail_percent, min_seconds, max_seconds]
  effect: read
  gives: {snapshot: json}
mock.RegisterInCmdb:
  vars: [device, change_ticket, fail_percent, min_seconds, max_seconds]
  effect: opens_external
  gives: {record_id: string}

# ------------------------------------------------------------------------------------------------ NBO demo jobs
# The jobs of the five demo workflows. Every one also takes ticket, demo_failure, fail_percent, min_seconds and
# max_seconds (see jobs/demo.py).

demo.Notify:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, channel, run_id, requested_by, summary, details]
  effect: idempotent
  gives: {posted: boolean, message: string}
itsm.RaiseChange:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, risk, application, target_version, dynamic_group]
  effect: opens_external
  gives: {change_number: string, state: string, short_description: string, window_start: string, window_end: string, url: string}
itsm.InsideWindow:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, change_number]
  effect: read
itsm.CloseChange:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, change_number, details]
  effect: idempotent
  gives: {closed: boolean, close_code: string}
itsm.UpdateTicket:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, note]
  effect: idempotent
  gives: {work_note: string, ticket_state: string}
firewall.ValidateFlows:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, flows]
  effect: read
  gives: {flows: list, flow_count: integer, objects: list}
firewall.PathAnalysis:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, flows]
  effect: read
  gives: {firewalls: list, firewall_count: integer, path: list, already_permitted: integer}
firewall.AssessRisk:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, flows, environment]
  effect: read
  gives: {risk: string, score: integer, findings: list, needs_review: boolean}
firewall.CompilePolicy:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, flows, firewalls, change_number]
  effect: read
  gives: {rules: list, rule_count: integer}
firewall.SnapshotPolicy:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device]
  effect: read
  gives: {policy: json, backup_id: string}
firewall.PushPolicy:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, rules, change_number, backup_id]
  effect: changes_network
  gives: {commit_id: string, rules_added: integer, pushed: list}
firewall.RestorePolicy:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, backup_id]
  effect: idempotent
  gives: {restored: string}
firewall.TestFlows:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, rules]
  effect: read
  gives: {hits: list}
firewall.TraceFlows:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, flows]
  effect: read
  gives: {traces: list}
firewall.ScheduleRecertification:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, expires, change_number]
  effect: idempotent
  gives: {review_task: string, expires: string}
compliance.BackupConfigs:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, dynamic_group]
  effect: read
  gives: {backed_up: integer, backups: list}
compliance.RunCompliance:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, dynamic_group, features]
  effect: read
  gives: {score: integer, compliant_devices: integer, noncompliant: list, noncompliant_count: integer, report: list}
compliance.CheckDevice:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, features, must_pass]
  effect: read
  gives: {compliance: json, failing: list, risk: string, score: integer}
compliance.GenerateRemediation:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, failing]
  effect: read
  gives: {remediation: list, line_count: integer}
compliance.BackupConfig:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device]
  effect: read
  gives: {backup_id: string}
compliance.ApplyRemediation:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, remediation, backup_id]
  effect: changes_network
  gives: {applied_lines: integer}
compliance.RestoreConfig:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, device, backup_id]
  effect: idempotent
  gives: {restored: string}
compliance.PublishReport:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, dynamic_group, score_before, score_after]
  effect: idempotent
  gives: {report_url: string, improvement: string}
software.PlanUpgrade:
  vars: [ticket, demo_failure, fail_percent, min_seconds, max_seconds, dynamic_group, target_version]
