name: ztp-call-home
description: >-
  Bootstrap one device from the Palo's DHCP Option 67: wait for the central ZTP file server to say it fetched its
  file by serial, check it's the box Nautobot planned, and, for the 9300, wait until it has converted to Meraki mode
  and called home to the Dashboard.
for: device
inputs:
  ticket: {type: string, default: RITM0000000}
  artifact_version: {type: string, optional: true}
  demo_failure: {type: string, default: none}
steps:
  - Called home:
      description: >-
        The ZTP file server calls back with the device's serial when the device fetches its bootstrap file.
      wait: callback
      with: {serial: device.serial}
      timeout: 4h
  - Verify identity:
      job: ztp.VerifyIdentity
      with: {artifact_version: artifact_version}
  - Converted to Meraki mode:
      description: >-
        The switch's script converts it to Meraki management; it reloads and pulls its config from the Dashboard by
        serial. If it never shows up, the person on site resets the switch and the step starts over.
      wait: meraki.SwitchConverted
      when: {device.role.name: office-switch}
      timeout: 1h
  - Mark bootstrapped:
      job: ztp.SetDeviceLifecycle
      with: {stage: 1}
