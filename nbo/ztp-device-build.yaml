name: ztp-device-build
description: >-
  Bring one device from its bootstrap to the office profile: upgrade it to the approved firmware and apply its
  config through the platform that owns it, set its local admin from BeyondTrust, and compare before and after.
for: device
inputs:
  ticket: {type: string, default: RITM0000000}
  office_type: {type: choice, choices: [normal, ebc], default: normal}
  demo_failure: {type: string, default: none}
steps:
  - phase: Prepare
  - Pre-check: ztp.PreCheck

  - phase: Firmware and profile
  - Upgrade PAN-OS:
      job: panorama.UpgradePanos
      rollback: panorama.RevertPanos
      when: {device.role.name: edge-firewall}
      timeout: 2h
  - Push Panorama templates:
      job: panorama.PushTemplates
      when: {device.role.name: edge-firewall}
  - Apply switch profile in Dashboard:
      job: meraki.ApplySwitchProfile
      when: {device.role.name: office-switch}
  - Upgrade OpenGear firmware:
      job: opengear.UpgradeFirmware
      when: {device.role.name: console-server}
  - Configure OpenGear:
      job: opengear.Configure
      when: {device.role.name: console-server}
  - Upgrade NMC firmware:
      job: apc.UpgradeNmc
      when: {device.role.name: [ups, pdu]}
      timeout: 30m
  - Configure APC:
      job: apc.Configure
      when: {device.role.name: [ups, pdu]}

  - phase: Local admin
  - Create local admin in BeyondTrust: pam.CreateLocalAdmin
  - Set local admin:
      job: pam.SetLocalAdmin
      with: {secret_id: create_local_admin_in_beyondtrust.secret_id}

  - phase: Verify
  - Post-check:
      job: ztp.PostCheck
      with: {pre: pre_check.snapshot}
  - Mark configured:
      job: ztp.SetDeviceLifecycle
      with: {stage: 2}
