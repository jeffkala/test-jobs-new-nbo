name: example-site-rollout
description: >-
  Roll out a site with mock jobs: reserve its addressing, order its circuit while the field team cables it,
  change every device in waves, and hand the site over.
for: location
# Display only: the run page draws the site's status against this track; SetLifecycle moves it.
lifecycle: [Planned, Addressed, Installed, Live]
inputs:
  site_code: {type: string, pattern: "^[A-Z]{3}[0-9]{2}$", help: "Three letters and two digits, such as BHM01"}
  change_ticket: {type: string, pattern: "^CHG[0-9]{7}$", help: "The approved change, such as CHG0052214"}
  office_type: {type: choice, choices: [branch, campus, datacenter], default: branch}
  vlan: {type: integer, label: VLAN, default: 120, min: 2, max: 4094}
  wants_circuit: {type: boolean, default: true, label: "Order a circuit"}
  go_live: {type: date, optional: true, label: "Planned go-live date"}
  contacts: {type: list, optional: true, help: "Site contacts, one a line"}
  notes: {type: text, optional: true}
  extra: {type: json, optional: true, help: "Anything else, as JSON"}
  site_message: {type: string, default: "The site is live."}
steps:
  - phase: Address
  - Allocate addressing:
      job: mock.AllocateAddressing
      rollback: mock.ReleaseAddressing
  - Mark addressed:
      job: mock.SetLifecycle
      with: {stage: 1, min_seconds: 5, max_seconds: 10}
  - Discover devices: mock.DiscoverDevices

  - phase: Install
  - Order circuit:
      job: mock.OrderCircuit
      when: {wants_circuit: true}
      after: [Discover devices]
  - Circuit delivered:
      description: The carrier calls back with the order number when the circuit is live.
      wait: callback
      with: {order: order_circuit.order_id}
      when: {wants_circuit: true}
      timeout: 2d
  - Generate port map:
      job: mock.GeneratePortMap
      after: [Discover devices]
  - Rack and cable:
      manual: field-ops
      description: >-
        Rack the devices and cable them to the port map below. Give the switches their management
        addresses from the prefix shown.
      with: {port_map: generate_port_map.port_map, prefix: allocate_addressing.mgmt_prefix}
  - Mark installed:
      job: mock.SetLifecycle
      with: {stage: 2, min_seconds: 5, max_seconds: 10}

  - phase: Turn up
  - Change devices:
      for_each: discover_devices.devices
      workflow: example-device-change
      with: {hostname: item.display}
      waves: 2

  - phase: Hand over
  - Handover approval:
      approve: network-change
      description: Check the devices and the circuit, then accept the site.
      after: [Change devices, Circuit delivered]
      timeout: 3d
  - Mark live:
      job: mock.SetLifecycle
      with: {stage: 3, min_seconds: 5, max_seconds: 10}
  - Tell the campus team:
      job: mock.Notify
      when: {office_type: [campus, datacenter]}
      with: {message: site_message, run_id: run.id, fail_percent: 0}
  - Announce:
      job: mock.Notify
      with: {message: site_message, run_id: run.id}
