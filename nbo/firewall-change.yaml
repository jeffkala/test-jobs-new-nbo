name: firewall-change
description: >-
  Open network access for an application: validate its flows, find every firewall on their path, score the risk,
  get security and change approval, then push the rules firewall by firewall and prove the traffic passes.
inputs:
  ticket: {type: string, pattern: "^RITM[0-9]{7}$", help: "The access request, such as RITM0012345"}
  application: {type: string, default: payments-api, help: "The application the access is for"}
  environment: {type: choice, choices: [production, staging, development], default: production}
  flows:
    type: list
    label: Flows
    help: "One mapping a flow: src, dst, port, proto and app. A source of 'any' is only allowed into the DMZ."
    default:
      - {app: payments-api, src: 10.20.30.0/24, dst: 172.16.10.25, port: 443, proto: tcp}
      - {app: payments-db-admin, src: 10.20.40.10, dst: 10.10.5.20, port: 22, proto: tcp}
      - {app: payments-monitoring, src: 10.10.0.50, dst: 172.16.10.25, port: 161, proto: udp}
  expires: {type: date, optional: true, label: "Access expires", help: "Temporary access gets a recertification task"}
  justification: {type: text, optional: true}
  demo_failure:
    type: choice
    label: "Demo: make a step fail"
    help: "Fails once for this ticket, so you can show the recovery"
    choices: [none, push-fails, flow-test-fails, change-not-raised]
    default: none
steps:
  - phase: Analyse
  - Validate flows: firewall.ValidateFlows
  - Path analysis:
      job: firewall.PathAnalysis
      with: {flows: validate_flows.flows}
  - Assess risk:
      job: firewall.AssessRisk
      with: {flows: validate_flows.flows}

  - phase: Approve
  - Security review:
      approve: security-architects
      description: >-
        The risk assessment rated these flows high or critical. Read its findings and the path analysis, then
        approve or reject. You can't approve a request you raised.
      when: {assess_risk.risk: [high, critical]}
      after: [Assess risk]
      timeout: 3d
  - Raise change:
      job: itsm.RaiseChange
      with: {risk: assess_risk.risk}
      after: [Assess risk]
  - CAB approved:
      description: >-
        ServiceNow calls back when the change advisory board decides, with the change number. A rejection
        fails the step; nothing is pushed.
      wait: callback
      with: {change: raise_change.change_number}
      after: [Security review, Raise change]
      timeout: 5d

  - phase: Implement
  - Compile policy:
      job: firewall.CompilePolicy
      with: {flows: validate_flows.flows, firewalls: path_analysis.firewalls, change_number: raise_change.change_number}
  - Push to firewalls:
      for_each: path_analysis.firewalls
      workflow: firewall-policy-push
      with: {rules: compile_policy.rules, change_number: raise_change.change_number}
      waves: 2

  - phase: Verify and close
  - Trace flows end to end:
      wait: firewall.TraceFlows
      with: {flows: validate_flows.flows}
      timeout: 30m
  - Schedule recertification:
      job: firewall.ScheduleRecertification
      when: {expires: true}
      with: {change_number: raise_change.change_number}
  - Close change:
      job: itsm.CloseChange
      with: {change_number: raise_change.change_number, details: compile_policy.rules}
      after: [Trace flows end to end]
  - Notify:
      job: demo.Notify
      with: {run_id: run.id, requested_by: run.requested_by, details: trace_flows_end_to_end.traces}
