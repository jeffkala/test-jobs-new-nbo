name: firewall-policy-push
description: >-
  Push a change's rules to one firewall: hold for the change window, snapshot the policy as a restore point, push
  and commit with an automatic restore if the commit fails, test the traffic, and read the policy back.
for: device
inputs:
  ticket: {type: string, default: RITM0000000}
  rules: {type: list, help: "The compiled rules; each firewall pushes its own"}
  change_number: {type: string, optional: true}
  demo_failure: {type: string, default: none}
steps:
  - phase: Prepare
  - Inside change window:
      wait: itsm.InsideWindow
      timeout: 7d
  - Snapshot policy: firewall.SnapshotPolicy

  - phase: Push
  - Push and commit:
      job: firewall.PushPolicy
      rollback: firewall.RestorePolicy
      with: {backup_id: snapshot_policy.backup_id}
      timeout: 10m
  - Test flows:
      wait: firewall.TestFlows
      timeout: 30m

  - phase: Confirm
  - Read policy back: firewall.SnapshotPolicy
