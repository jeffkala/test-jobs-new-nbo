name: compliance-remediate-device
description: >-
  Bring one device back to the golden config: find what drifted, render the fix, approve it when it touches AAA
  or SSH, back up, push with an automatic restore, and prove the device complies.
for: device
inputs:
  ticket: {type: string, default: CHG0000000}
  features: {type: list, default: [aaa, ntp, snmp, logging, banner, ssh]}
  demo_failure: {type: string, default: none}
steps:
  - phase: Analyse
  - Check compliance: compliance.CheckDevice
  - Generate remediation:
      job: compliance.GenerateRemediation
      with: {failing: check_compliance.failing}

  - phase: Approve
  - High-risk fix approval:
      approve: network-change
      description: The fix changes AAA or SSH, which can lock people out. Check the remediation lines first.
      when: {check_compliance.risk: high}
      timeout: 1d

  - phase: Fix
  - Back up config: compliance.BackupConfig
  - Apply remediation:
      job: compliance.ApplyRemediation
      rollback: compliance.RestoreConfig
      with: {remediation: generate_remediation.remediation, backup_id: back_up_config.backup_id}
      timeout: 10m
  - Verify compliance:
      job: compliance.CheckDevice
      with: {must_pass: true}
