name: ztp-firewall-bootstrap
description: >-
  Bootstrap one Palo Alto firewall from the USB drive the installer inserted before powering it on: wait until it
  reaches Panorama over the VPN tunnels in its base config, and check it's the box Nautobot planned.
for: device
inputs:
  ticket: {type: string, default: RITM0000000}
  artifact_version: {type: string, optional: true}
  demo_failure: {type: string, default: none}
steps:
  - Connected to Panorama:
      description: >-
        The firewall reads its USB drive at first boot: static WAN, management and the VPN tunnels back to the
        corporate network. Panorama isn't exposed to the internet, so it sees the firewall once the tunnels are up.
      wait: panorama.DeviceConnected
      timeout: 2h
  - Verify identity:
      job: ztp.VerifyIdentity
      with: {artifact_version: artifact_version}
  - Mark bootstrapped:
      job: ztp.SetDeviceLifecycle
      with: {stage: 1}
